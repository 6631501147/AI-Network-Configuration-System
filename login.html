<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — NetConfig AI · MFU IAM</title>
  <meta name="description" content="Sign in to NetConfig AI — AI-based Automatic Network Configuration System powered by Mae Fah Luang University.">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="auth.css">
</head>
<body>

  <!-- Animated background particles -->
  <div class="bg-layer">
    <div class="bg-grid"></div>
    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>
    <div class="orb orb-3"></div>
    <canvas id="particles-canvas"></canvas>
  </div>

  <!-- Main card -->
  <div class="auth-wrapper">
    <div class="auth-card" id="login-card">

      <!-- Left panel — branding -->
      <div class="auth-side-brand">
        <div class="brand-glow"></div>
        <div class="brand-content">
          <img src="mfu_logo.png" alt="Mae Fah Luang University" class="brand-logo" id="brand-logo-img">
          <h1 class="brand-title">NetConfig AI</h1>
          <p class="brand-sub">AI-based Automatic Network Configuration System</p>
          <div class="brand-university">
            <span class="uni-label">Mae Fah Luang University</span>
            <span class="uni-sub">School of Information Technology</span>
          </div>
        </div>
        <div class="brand-footer-deco"></div>
      </div>

      <!-- Right panel — form -->
      <div class="auth-side-form">
        <div class="form-inner">

          <!-- Header -->
          <div class="form-header">
            <div class="iam-badge">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
              IAM Access Portal
            </div>
            <h2 class="form-title">Welcome Back</h2>
            <p class="form-subtitle">Sign in with your MFU credentials to continue</p>
          </div>

          <!-- Alert box (hidden by default) -->
          <div class="alert-box" id="login-alert" style="display:none"></div>

          <!-- Form -->
          <form id="login-form" class="auth-form" autocomplete="off">

            <div class="field-group">
              <label for="login-email" class="field-label">MFU Email / Username</label>
              <div class="field-wrap">
                <svg class="field-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                <input type="text" id="login-email" class="field-input" placeholder="e.g. 6631501XXX@lamduan.mfu.ac.th" required autocomplete="username">
              </div>
            </div>

            <div class="field-group">
              <label for="login-password" class="field-label">
                Password
                <a href="#" class="field-link" id="forgot-link">Forgot password?</a>
              </label>
              <div class="field-wrap">
                <svg class="field-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                <input type="password" id="login-password" class="field-input" placeholder="Enter your password" required autocomplete="current-password">
                <button type="button" class="toggle-pw" id="toggle-pw-login" aria-label="Show password">
                  <svg class="eye-icon" id="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                  <svg class="eye-icon" id="eye-closed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                </button>
              </div>
            </div>

            <div class="field-row">
              <label class="checkbox-label">
                <input type="checkbox" id="remember-me" class="checkbox-input">
                <span class="checkbox-custom"></span>
                Remember me for 30 days
              </label>
            </div>

            <button type="submit" class="btn-primary" id="login-btn">
              <span class="btn-text">Sign In</span>
              <span class="btn-loader" style="display:none">
                <svg class="spin" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>
              </span>
            </button>

          </form>

          <!-- Divider -->
          <div class="divider"><span>or continue with</span></div>

          <!-- MFU Google SSO -->
          <button class="btn-google" id="btn-google-login">
            <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/><path fill="none" d="M0 0h48v48H0z"/></svg>
            Sign in with MFU Google Account
          </button>

          <!-- Footer -->
          <p class="form-footer">
            Don't have an account?
            <a href="register.html" class="link-primary">Create account</a>
          </p>

        </div>
      </div>

    </div>
  </div>

  <script src="auth.js"></script>
</body>
</html>
